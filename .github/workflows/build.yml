name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build on ${{ matrix.os }} / JDK ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: 'maven'

      # Quarkus 999-SNAPSHOT (main, the future Quarkus 4) : the daily snapshot of quarkusio/quarkus-ecosystem-ci
      - name: Install the Quarkus snapshot
        uses: quarkusio/install-quarkus-snapshots-action@main

      - name: Build with Maven
        run: mvn -B -nsu clean install -Dno-format

      - name: Build with Maven (Native)
        if: matrix.java == 21
        run: mvn -B -nsu install -Dno-format -Dnative -Dquarkus.native.container-build -Dnative.surefire.skip

      # not cached with the Maven repository
      - name: Remove the Quarkus snapshot
        if: always()
        uses: quarkusio/install-quarkus-snapshots-action/cleanup@main
